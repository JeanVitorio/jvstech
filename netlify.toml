# ---------------------------------------------------------
# Aplicativo JVS LeadFlow incorporado ao site principal
# ---------------------------------------------------------
[[redirects]]
  from = "/LeadFlow"
  to = "/LeadFlow/"
  status = 301

[[redirects]]
  from = "/LeadFlow/*"
  to = "/LeadFlow/index.html"
  status = 200

# Cabeçalhos de segurança do LeadFlow (bloqueia iframe e sniffing de MIME)
[[headers]]
  for = "/LeadFlow/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ---------------------------------------------------------
# Rewrite (proxy) para o template de MECANICA
# ---------------------------------------------------------

[[redirects]]
  from = "/mecanica/*"
  to = "https://jvstechmecanica.netlify.app/:splat"
  status = 200
  force = true

# ---------------------------------------------------------
# Rewrite (proxy) para o template de CARROS
# ---------------------------------------------------------
[[redirects]]
  from = "/carros"
  to = "https://zailonsoftinst.netlify.app/:splat"
  status = 200
  force = true

# ---------------------------------------------------------
# Regra original do seu site (SPA fallback)
# Precisa ficar por ULTIMO, pois e um "pega tudo"
# ---------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200